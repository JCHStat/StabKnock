name: R syntax check

on:
  push:
  pull_request:

jobs:
  parse-r-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - name: Parse R source files
        shell: Rscript {0}
        run: |
          files <- list.files(".", pattern = "[.]R$", recursive = TRUE, full.names = TRUE)
          invisible(lapply(files, parse))
          message("Parsed ", length(files), " R files successfully.")
